# Deploy record. Production does not build this service — it pulls the prebuilt image that
# .gitea/workflows/image-check-publish.yml publishes, and it follows the `:latest` tag.
#
# Updates are driven by Portainer's own image updater: it polls the tag above and redeploys when
# the digest behind it moves. Nothing between the registry and this container asks a human
# anything, which is exactly why the smoke gate in CI sits BETWEEN `docker build` and
# `docker push` — an image that reaches `:latest` is an image that is already on its way in.
#
# This is a long-polling Telegram bot. It opens no listening socket, so there is nothing to route
# and nothing to health-check over HTTP — no reverse-proxy labels, no `ports:`, no `healthcheck:`.
#
# THIS FILE IS A RECORD OF WHAT RUNS, not a template for a fresh install. The volume below is
# declared `external`, so `docker compose up` from this file expects that volume to already exist
# and fails loudly if it does not. README.md carries a self-contained compose block for anybody
# deploying their own copy; that one creates its own volume and is the right starting point.
#
# Every value below is a PLACEHOLDER (XXX) or a non-secret default. Real tokens, keys and addresses
# live only in the deployment's own environment and are never committed here — this repository is
# public and mirrored.
#
# ── Two things noticed while transcribing the running stack ────────────────────────────────────
#
# 1. The deployed container sets CALDAV_TIMEZONE, and it does nothing at all. Commit 94e4146
#    renamed that variable to TZ and src/config.py has read only TZ ever since; the old name was
#    left behind in the stack and nothing reads it. It is deliberately NOT reproduced below —
#    carrying it forward would keep suggesting there are two timezone knobs when there is one — but
#    it is worth deleting from the deployment too, so nobody edits it expecting an effect. Both
#    names currently hold the same value there, so removing it changes nothing.
#
# 2. `restart: unless-stopped` below is what the container actually runs, and it differs from the
#    `always` used elsewhere in this fleet. The difference shows up exactly once, in the worst
#    moment: `unless-stopped` leaves a container that an operator stopped by hand stopped across a
#    daemon restart, `always` brings it back. Recorded as deployed rather than normalised to the
#    convention, because this file's job is to say what is running; changing the policy is a
#    deliberate act for the deployment, not a side effect of writing it down.

# The compose project name, and it is load-bearing rather than decorative — see the volume note
# below. It is recorded here because a deploy record that omits it is not a record: the project
# name is what turns every short name in this file into the real object on the host.
# Be aware of its precedence, though: a top-level `name:` is the LOWEST-priority source there is.
# `-p`, COMPOSE_PROJECT_NAME and Portainer (which names the project after the stack) all override
# it. So it documents the intent; it does not enforce it. The enforcement is in the volume.
name: telegram_bots

volumes:
  # One JSON file per user, holding that user's CalDAV username and password in PLAIN TEXT — this
  # volume is other people's calendar credentials, and losing it means every user has to run
  # /caldav again with a fresh app password.
  #
  # Declared `external` with its FULL real name, and that is the whole point of this block. Docker
  # composes a short volume name with the project name to form the real one, so a stack deployed
  # under any name other than the one above would resolve `caldavllm_bot` to a NEW, EMPTY volume
  # while the real one sat there untouched and unreferenced. Nothing would fail: the bot would come
  # up perfectly healthy and simply ask every user to configure their calendar again — the quietest
  # possible way to lose the only state this service has.
  # Naming it absolutely removes the dependency on the project name entirely, and converts that
  # silent data loss into a loud "external volume not found" before the container ever starts.
  caldavllm_bot:
    external: true
    name: telegram_bots_caldavllm_bot

services:
  caldavllm_bot:
    image: gitea.vvzvlad.xyz/projects/caldavllm_bot:latest
    container_name: caldavllm_bot
    restart: unless-stopped
    volumes:
      # Must stay /app/data: src/users.py resolves its store from the RELATIVE path "data" against
      # the image's WORKDIR (/app). A different mount point does not fail — it silently leaves the
      # credentials inside the container, to be lost on the next update. The smoke gate asserts
      # both halves of that (WORKDIR and the directory) for this reason.
      - caldavllm_bot:/app/data
    environment:
      # ── Telegram ──────────────────────────────────────────────────────────────
      BOT_TOKEN: XXX
      TELEGRAM_BOT_API_SERVER: XXX        # base URL of the self-hosted Bot API server

      # ── LLM ───────────────────────────────────────────────────────────────────
      # Both keys are set even though only one provider runs: src/config.py refuses to start unless
      # at least one is present, and having both means LLM_PROVIDER can be flipped without also
      # remembering to add a key.
      DEEPSEEK_API_KEY: XXX
      GROQ_API_KEY: XXX
      LLM_PROVIDER: groq                  # "deepseek" | "groq"; anything else is refused at startup

      # MODEL is not set: config.py picks the per-provider default (openai/gpt-oss-120b for groq),
      # which is what this deployment wants. Same for DAILY_TOKEN_LIMIT (30000),
      # MESSAGE_BATCH_TIMEOUT (0.8) and MAX_BATCH_SIZE (30) — all left at their defaults, which is
      # why the smoke gate pins those defaults: here they are not defaults, they are the
      # configuration.
      TZ: Europe/Moscow                   # written into DTSTART/DTEND of every event created
    # No `networks:` block, and that is the deployment: this service is attached to nothing but the
    # implicit default network of its own compose project. It joins no shared network because it
    # needs none — everything it talks to (Telegram's API server, the LLM, each user's CalDAV
    # server) it reaches outbound, and nothing ever connects to it.
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    labels:
      # Opts this container in to automatic redeployment when `:latest` moves. The key is
      # watchtower's for historical reasons — watchtower itself is long gone from this fleet — and
      # the label is now read by Portainer's own native image updater, which kept the old key so
      # that nothing had to be relabelled. Keep it in step with the tag on the `image:` line above:
      # an updater pointed at a tag CI never moves is an updater that silently does nothing.
      com.centurylinklabs.watchtower.enable: "true"
