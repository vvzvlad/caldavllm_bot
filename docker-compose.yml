# Deploy record. Production does not build this service — it pulls the prebuilt image that
# .gitea/workflows/image-check-publish.yml publishes, and it follows the `:latest` tag.
#
# Portainer's image updater polls that tag and redeploys when its digest moves, with no human in
# between; that is why the CI smoke gate sits between `docker build` and `docker push`.
#
# This is a long-polling Telegram bot. It opens no listening socket, so there is nothing to route
# and nothing to health-check over HTTP — no reverse-proxy labels, no `ports:`, no `healthcheck:`.
#
# This file records what runs; it is not a template for a fresh install. The volume below is
# `external`, so `docker compose up` fails if it does not already exist. README.md carries a
# self-contained compose block for deploying your own copy.
#
# Every value below is a PLACEHOLDER (XXX) or a non-secret default. Real tokens, keys and addresses
# live only in the deployment's own environment — this repository is public and mirrored.
#
# The deployed container also sets CALDAV_TIMEZONE, which nothing reads (src/config.py reads only
# TZ); it is not reproduced here and can be deleted from the deployment.
#
# `restart: unless-stopped` is what the container runs, unlike the `always` used elsewhere in this
# fleet: a container stopped by hand stays stopped across a daemon restart. Recorded as deployed;
# changing it is a decision for the deployment.

# The compose project name: it turns every short name in this file into the real object on the
# host. A top-level `name:` has the lowest priority (`-p`, COMPOSE_PROJECT_NAME and Portainer's
# stack name override it), so it documents the intent; the volume below enforces it.
name: telegram_bots

volumes:
  # One JSON file per user, holding that user's CalDAV username and password in PLAIN TEXT —
  # losing this volume means every user has to run /caldav again with a fresh app password.
  #
  # Declared `external` with its FULL real name. Compose prefixes short volume names with the
  # project name, so under any other project name `caldavllm_bot` would resolve to a new, empty
  # volume and the bot would quietly ask every user to reconfigure. The absolute name turns that
  # into a loud "external volume not found" before the container starts.
  caldavllm_bot:
    external: true
    name: telegram_bots_caldavllm_bot

services:
  caldavllm_bot:
    image: gitea.vvzvlad.xyz/projects/caldavllm_bot:latest
    container_name: caldavllm_bot
    restart: unless-stopped
    volumes:
      # Must stay /app/data: src/users.py resolves its store from the RELATIVE path "data" against
      # the image's WORKDIR (/app). A different mount point does not fail — it silently leaves the
      # credentials inside the container, to be lost on the next update. The smoke gate asserts
      # both halves of that (WORKDIR and the directory) for this reason.
      - caldavllm_bot:/app/data
    environment:
      # ── Telegram ──────────────────────────────────────────────────────────────
      BOT_TOKEN: XXX
      TELEGRAM_BOT_API_SERVER: XXX        # base URL of the self-hosted Bot API server

      # ── LLM ───────────────────────────────────────────────────────────────────
      # Every key is set even though only one provider runs: src/config.py refuses to start unless
      # at least one is present, and having them all means LLM_PROVIDER can be flipped without also
      # remembering to add a key.
      DEEPSEEK_API_KEY: XXX
      GROQ_API_KEY: XXX
      GLM_API_KEY: XXX                    # Z.ai (api.z.ai), used by LLM_PROVIDER=glm
      LLM_PROVIDER: glm                   # "glm" | "groq" | "deepseek"; anything else is refused at startup

      # MODEL is not set: config.py picks the per-provider default (openai/gpt-oss-120b for groq,
      # glm-4.6v for glm), which is what this deployment wants. Same for DAILY_TOKEN_LIMIT (30000),
      # MESSAGE_BATCH_TIMEOUT (0.8) and MAX_BATCH_SIZE (30) — all left at their defaults, which is
      # why the smoke gate pins those defaults: here they are not defaults, they are the
      # configuration.
      TZ: Europe/Moscow                   # written into DTSTART/DTEND of every event created
    # No `networks:` block, and that is the deployment: this service is attached to nothing but the
    # implicit default network of its own compose project. It joins no shared network because it
    # needs none — everything it talks to (Telegram's API server, the LLM, each user's CalDAV
    # server) it reaches outbound, and nothing ever connects to it.
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    labels:
      # Opts this container in to automatic redeployment when `:latest` moves. The key is
      # watchtower's, but it is read by Portainer's native image updater, which accepts it. Keep it in
      # step with the tag on the `image:` line above: an updater pointed at a tag CI never moves
      # silently does nothing.
      com.centurylinklabs.watchtower.enable: "true"
