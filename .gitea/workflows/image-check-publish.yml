name: Docker Image CI

# No `pull_request` trigger: this workflow pushes :latest, the tag production follows (the deployed
# container carries an auto-update label, see docker-compose.yml, so Portainer redeploys whatever
# lands on it). PRs are covered by tests.yml, which builds the same image and runs the same gate
# but never logs in or pushes.
#
# Nobody approves anything between `docker push` and the rollout, so the smoke gate is the last
# point where a broken image can be stopped. Order: build -> smoke -> login -> push :<sha> then
# :latest. Logging in after the build keeps the credential away from the Dockerfile's RUN steps on
# this shared self-hosted runner.
#
# There is no test job: tests/test_llm.py needs API_KEY and most of its tests call the real,
# billed `parse_calendar_event()` and assert on the content of the answer. It is a prompt-quality
# harness run by hand; in CI it would cost money on every push and go red on model drift. The
# hermetic smoke gate below carries the whole load.
#
# The `branches:` filter must name the real default branch: a filter naming a missing branch
# silently stops matching.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# No `packages: write` here: that scope is GitHub-specific and has no effect on Gitea Actions — the
# built-in token carries no package scope at all. The registry push below authenticates with the
# REGISTRY_TOKEN secret instead.
permissions:
  contents: read   # checkout

# Two pushes in a row must not race: the older run may finish last and leave ITS :latest on the
# registry, so the next updater poll would ship the previous commit. The group serialises runs, so
# the newest commit's :latest is written last. Cancelling is OFF so a running older run can finish
# and publish its :<sha> rollback tag. This does not guarantee a tag per commit: on three or more
# quick pushes the pending run is superseded and never built. A per-SHA group would give that up in
# exchange for losing the :latest ordering, which matters more.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # `ubuntu-latest` is a LABEL, not a machine: the instance-level runner registered in Gitea
    # advertises it and serves every repository on the instance. Writing the runner's own name here
    # would leave the job queued forever, because no runner offers a label by that name.
    runs-on: ubuntu-latest
    # The three step-level timeouts below come to 53 minutes (20 build + 18 smoke + 15 push); 60
    # leaves 7 on top for checkout, the registry login, the two cleanup steps and the logout. The
    # outer bound
    # has to EXCEED the sum, not equal it: act_runner kills the whole job when this fires, and a
    # step marked `if: always()` is not guaranteed to run afterwards — so a job that dies mid-push
    # leaves the smoke containers and a few hundred MB of image sitting on the daemon the entire
    # fleet shares.
    timeout-minutes: 60
    # Job-level, so the smoke step and the cleanup step share one value: ci/smoke.py names its five
    # containers after it and the cleanup step removes them by the same names. The run id keeps
    # concurrent runs on the shared daemon apart; ci/smoke.py refuses to start without it.
    env:
      SMOKE_NAME: caldavllm-bot-smoke-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Compute image tags
      id: tags
      # main -> :latest + :<sha> (production follows :latest); any other branch -> :<branch>.
      # The branch name in the check below, the `branches:` filter at the top and the `pull_request`
      # filter in tests.yml must all name the real default branch. A mismatch fails silently: either the
      # workflow stops triggering, or it builds on every push without ever producing :latest.
      # workflow_dispatch can run off any ref, so the else branch must stay correct. Never hardcode a
      # fixed tag there: a side-branch build would overwrite the tag production deploys from.
      env:
        # Passed through the environment instead of being interpolated into the script text: git
        # allows `$`, backticks, quotes and parentheses in branch names, so a branch like
        # `feat/$(id)` would otherwise execute on the runner, which is self-hosted and shared with
        # every other repository on the instance.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Gitea allows uppercase letters in repository names, docker does not accept them in an
        # image path — a repo like `CalDAVLLM_Bot` would fail the build with `invalid reference
        # format`, so lowercase it here. Owner and name both come from $REPO, so no hand-written
        # path can drift; docker-compose.yml's `image:` line is hand-written and is the one place
        # to update by hand when the registry moves.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "main" ]; then
          # Tag ORDER matters: the push step iterates over $TAGS left to right, so :latest is pushed
          # LAST and acts as the commit of the whole publication. If :<sha> fails to push, the run
          # stops before :latest moves and production keeps the previous image. The reverse order
          # would publish a :latest whose immutable :<sha> rollback twin never reached the registry.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          # The smoke gate needs ONE unambiguous tag out of the list above. The :<sha> one is it —
          # :latest is a moving target shared with whatever ran before, :<sha> can only ever mean
          # this commit's image.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Sanitise the branch name into a legal docker tag: everything outside [A-Za-z0-9_.-] (a
          # `/` in feat/foo above all) becomes `-`, and the result is cut to 100 chars — branch
          # names have no length limit, docker rejects tags over 128. The `sed` fixes the first
          # character: docker requires a tag to match [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}, so a branch
          # like `-fix`, `(test)` or `+wip` would otherwise produce a leading `-` and fail the build
          # with `invalid reference format`.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # The sanitiser passes a name through untouched when it already consists of legal
          # characters, so a branch literally named `latest` would come out as the production tag
          # and — one manual workflow_dispatch later — ship unreviewed code into the stack. The
          # `main` check above does not cover this: the branch is not `main`, it only borrows its
          # tag.
          # Reserved names are therefore prefixed instead of being used as-is.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      # Step-level `timeout-minutes` is the one known to be enforced by Gitea's act_runner; the
      # job-level one above is only the outer bound. 20 minutes is well above a realistic cold
      # build: six pinned wheels on python:3.11-slim, of which lxml (pulled in by caldav) is the
      # only one big enough to notice.
      timeout-minutes: 20
      env:
        # Through the environment, not interpolated into the script text: the only thing standing
        # between a branch name and command execution on the runner is the `tr` filter in the step
        # above. `$TAGS` below is intentionally unquoted — the tags are a space-separated list and
        # word splitting is exactly what turns it into loop items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull is required here: unlike GitHub's ephemeral runners, this runner is self-hosted
        # with a persistent docker daemon, so without the flag the once-pulled python:3.11-slim
        # would sit in its cache for months and every build would inherit an unpatched base layer.
        # Note that this IS a BuildKit build even though no `docker buildx` appears on the line:
        # BuildKit has been `docker build`'s default since Engine 23.0. It caches into its own
        # builder store, which is why the cleanup step at the end of this job cannot reclaim
        # everything — see the caveat there.
        docker build --pull . --file Dockerfile $tag_args

    - name: Smoke-test the built image
      # The gate. It sits between build and push: a red smoke means nothing reaches the registry and
      # production keeps the previous image. It is the only automated check (see the note at the top).
      #
      # ci/smoke.py runs on the runner and drives `docker` itself for the container-level checks
      # (`docker inspect`, broken-environment runs, the real CMD's log); the code-level checks run in a
      # probe fed to `docker exec -i <name> python -u -`, inside the container where the wheels are.
      #
      # No port is published: this is a long-polling Telegram bot with no listening socket, and the job
      # runs in act_runner's container while docker drives a daemon outside it, so a published port would
      # be unreachable anyway.
      #
      # The runner image has `python3` but no bare `python`; inside the container the interpreter is
      # `python`, and ci/smoke.py invokes it accordingly.
      #
      # The gate holds no credential and reaches no external service: fake bot token, fake LLM keys, and
      # the Telegram API server pointed at a loopback port nothing binds. All five containers carry
      # $SMOKE_NAME, so concurrent runs cannot collide.
      #
      # Step-level `timeout-minutes` is the one act_runner enforces. 18 minutes covers ci/smoke.py's
      # documented worst case of 945 s; in practice the gate takes under a minute. If the step is killed
      # by this timeout, the script's own cleanup does not run and the `if: always()` step below does it.
      timeout-minutes: 18
      env:
        # SMOKE_NAME is not here: it is set once at job level, so this step and the cleanup step
        # below are guaranteed to be talking about the same containers.
        SMOKE_IMAGE: ${{ steps.tags.outputs.smoke }}
      # The body of this step is byte-identical to the one in tests.yml. Only the `env:` values
      # above differ. The PR gate and the publishing gate must run the same checks against the same
      # kind of container, and the cheapest way to guarantee that is for the two to be literally the
      # same text — anything else drifts, and it drifts silently, in the direction of the PR gate
      # testing less.
      run: |
        python3 ci/smoke.py

    - name: Log in to the Gitea container registry
      # Placed here, not at the top of the job: `docker build` runs arbitrary RUN instructions
      # (including `pip install`) and the smoke step runs the image's own code, both on a
      # self-hosted runner shared with every other repository. Logging in only now keeps the
      # registry credentials out of the job's docker config for the build-and-test stretch.
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # A PAT carrying the `write:package` scope, provided to this repository as a secret. The
        # built-in Gitea Actions token cannot be used in its place: it carries no package scope at
        # all.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Push Docker images
      # 15 minutes for a python:3.11-slim base with six wheels on top of it. That is generous on a
      # healthy link and meant to be: a bound too tight would abort a push that was making perfectly
      # good progress, leaving a half-pushed :<sha> and no :latest.
      timeout-minutes: 15
      env:
        # Same reasoning as in the build step: pass the tags through the environment, and leave
        # `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # `set -e` makes the tag-order guarantee local to this step: a failed `:<sha>` push must
        # stop the loop before it reaches `:latest`. Without it the stop would rest on act_runner
        # invoking `run:` as `bash -e {0}`, a property of the runner image rather than this file.
        set -e
        # Split first, then count what the loop will iterate over: `[ -n "$TAGS" ]` would pass a
        # whitespace-only value that still yields zero iterations and a green step. `set --` applies the
        # same splitting as the `for`, so `$#` is the number of tags really pushed. `set -u` would not help:
        # an expression that resolved to nothing arrives set but empty. Without this check a tag step with
        # no output would give a green push that published nothing, leaving :latest on the previous image.
        set -- $TAGS
        [ "$#" -gt 0 ] || { echo "No tags to push: the tag-computation step produced no usable output. Refusing to report a successful push that pushed nothing — :latest would stay on the previous image and look deployed." >&2; exit 1; }
        for tag in "$@"; do docker push "$tag"; done

    - name: Remove the smoke containers from the runner
      # `always()`, and before the image cleanup: the runner's docker daemon is persistent and shared, so
      # a leftover container would stay forever and pin the image, failing the `docker rmi` below.
      # ci/smoke.py removes its containers itself; this step is for a run killed by the step timeout.
      # All five suffixes are removed: when ci/smoke.py's subprocess timeout fires it kills the docker
      # client, not the container, so a hung guard survives its `--rm`.
      # $SMOKE_NAME comes from the job-level `env:`, the same value the smoke step used.
      if: always()
      run: |
        # The empty suffix is the probe container the in-image checks run inside; -noenv, -notoken
        # and -provider are the three short-lived ones the startup-guard check runs with `--rm`;
        # -cmd is the one started with the image's real command, which deliberately carries no
        # `--rm` at all because its state is inspected after it has exited. Kept in step with
        # GUARD_CASES and CMD_SUFFIX in ci/smoke.py.
        # No `set -eu` here on purpose: this is best-effort cleanup, every removal already ends in
        # `|| true`, and failing the step would turn a leftover container into a red job.
        for suffix in "" -noenv -notoken -provider -cmd; do docker rm -f "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built images from the runner
      # The daemon is persistent, so built images would pile up. This removes ONLY the tags this run
      # created; `docker system prune` would also wipe other repositories' images. It does not free the
      # BuildKit cache (`docker builder prune`) or the dangling base image left by `--pull` when
      # python:3.11-slim moves; both need a periodic cleanup on the runner host.
      # `always()` so the cleanup runs even when the smoke or the push fails.
      # An empty $TAGS is accepted here, unlike in the push step: removing nothing when there is nothing
      # to remove is correct, while publishing nothing and reporting success is not. The body below is
      # shared verbatim with tests.yml, which has no push step, so the contrast is stated here.
      if: always()
      env:
        # Same reasoning as in the build step: pass the tags through the environment, and leave
        # `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # An empty $TAGS is legitimate here (see the step comment). If the tag step failed, nothing was
        # built; if it wrote no output, the image is untagged and only the periodic prune can reclaim it,
        # and the run is still red because ci/smoke.py refuses an empty SMOKE_IMAGE.
        for tag in $TAGS; do docker rmi "$tag" || true; done

    - name: Log out of the Gitea container registry
      # Counterpart to the login: `docker login` writes the credential into a docker config that outlives
      # this job on a shared self-hosted runner. `always()`, and last, so a failed push, a cancelled run
      # or a timeout does not leave a working registry credential behind. tests.yml never logs in, so it
      # has no counterpart step.
      if: always()
      run: |
        # `|| true` because this step also runs on the paths where the login never happened — a red
        # smoke, a failed build — and `docker logout` against a registry that was never logged in
        # to should not turn a diagnosable failure above into a confusing one down here.
        docker logout gitea.vvzvlad.xyz || true
